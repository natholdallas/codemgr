# Auto-generated by main.sh (download endpoint) — edit main.sh domains[] and re-run webconf
server {
    listen 80;
    server_name @DOMAIN@;
    root @DOWNLOAD_DIR@;
    index index.html;

    # hashed build assets can be cached forever
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # installers are immutable per release but downloads may be replaced; cache briefly
    location /downloads/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=86400";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}