# Auto-generated by main.sh (usr endpoint) — edit main.sh domains[] and re-run webconf
@DOMAIN@ {
    root * @USR_DIR@
    encode gzip zstd

    handle /usr/api/* {
        reverse_proxy @API_ADDR@ {
            header_up X-Forwarded-For {remote_host}
        }
    }

    handle /api/* {
        reverse_proxy @API_ADDR@ {
            header_up X-Forwarded-For {remote_host}
        }
    }

    # media is sealed on disk, so the backend decrypts every request
    handle /media/* {
        reverse_proxy @API_ADDR@ {
            header_up X-Forwarded-For {remote_host}
        }
    }

    handle {
        try_files {path} /index.html
        file_server
    }
}