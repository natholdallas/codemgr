[package]
name = "codemgr-vault"
version = "0.1.0"
description = "Codemgr Vault desktop app"
edition = "2021"
rust-version = "1.90"

[lib]
name = "codemgr_vault_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
