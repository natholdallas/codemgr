# media.xxxx.com — proxy for the media endpoint.
#
# Media files are encrypted at rest (see internal/crypt), so the backend is the
# only process that can read them. Never point nginx `root`/`alias` at
# `resources.media`: it would serve ciphertext. Point `resources.media-url` in
# conf.toml to `https://media.xxxx.com` and let this host proxy to the backend
# `/media/` route.
#
# Usage (adjust the proxy target to `app.port` on the server):
server {
  listen 443 ssl;
  server_name media.xxxx.com;

  # ssl_certificate     /etc/ssl/media.xxxx.com.crt;
  # ssl_certificate_key /etc/ssl/media.xxxx.com.key;

  client_max_body_size 20m;

  location / {
    proxy_pass http://127.0.0.1:8080/media/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

# If you don't want a separate domain, the main site block already proxies
# /media/ to the backend (assets/nginx/{usr,adm,api}.conf).
