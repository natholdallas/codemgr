# Auto-generated by main.sh (adm endpoint) — edit main.sh domains[] and re-run webconf
@DOMAIN@ {
    root * @ADM_DIR@
    encode gzip zstd

    handle /adm/api/* {
        reverse_proxy @API_ADDR@
    }

    handle /api/* {
        reverse_proxy @API_ADDR@
    }

    # media is sealed on disk, so the backend decrypts every request
    handle /media/* {
        reverse_proxy @API_ADDR@
    }

    handle {
        try_files {path} /index.html
        file_server
    }
}