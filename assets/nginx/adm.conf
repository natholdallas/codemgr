# Auto-generated by main.sh (adm endpoint) — edit main.sh domains[] and re-run webconf
server {
    listen 80;
    server_name @DOMAIN@;
    client_max_body_size @CLIENT_MAX_BODY@;
    root @ADM_DIR@;
    index index.html;

    # api same-origin behind the app prefix
    location /adm/api/ {
        proxy_pass http://@API_ADDR@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://@API_ADDR@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # media is sealed on disk, so the backend decrypts every request
    location /media/ {
        proxy_pass http://@API_ADDR@;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # hashed build assets can be cached forever
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}