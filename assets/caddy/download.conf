# Auto-generated by main.sh (download endpoint) — edit main.sh domains[] and re-run webconf
@DOMAIN@ {
    root * @DOWNLOAD_DIR@
    encode gzip zstd

    handle /_nuxt/* {
        header Cache-Control "public, max-age=31536000, immutable"
        file_server
    }

    handle /downloads/* {
        header Cache-Control "public, max-age=86400"
        file_server
    }

    handle {
        try_files {path} /index.html
        file_server
    }
}