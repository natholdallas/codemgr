# Auto-generated by main.sh (media endpoint) — edit main.sh domains[] and re-run webconf
# Media files are encrypted at rest, so this host only proxies to the backend
# route that decrypts them. Nginx must never read the media directory directly.
server {
    listen 80;
    server_name @DOMAIN@;
    client_max_body_size @CLIENT_MAX_BODY@;

    location / {
        proxy_pass http://@API_ADDR@/media/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
