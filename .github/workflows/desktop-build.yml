name: Build installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal dmg)
            os: macos-14
            args: --target universal-apple-darwin --bundles dmg
            artifact: macos
            paths: web/apps/usr/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            rust_targets: x86_64-apple-darwin
          - name: Windows (NSIS exe)
            os: windows-latest
            args: --bundles nsis
            artifact: windows
            paths: web/apps/usr/src-tauri/target/release/bundle/nsis/*.exe
            rust_targets: ''
          - name: Linux (deb + AppImage)
            os: ubuntu-24.04
            args: --bundles deb,appimage
            artifact: linux
            paths: |
              web/apps/usr/src-tauri/target/release/bundle/deb/*.deb
              web/apps/usr/src-tauri/target/release/bundle/appimage/*.AppImage
            rust_targets: ''
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/apps/usr/src-tauri -> target
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate API SDK
        run: |
          go install github.com/swaggo/swag/v2/cmd/swag@v2.0.0-rc5
          "$(go env GOPATH)/bin/swag" init --parseDependency --parseInternal
          rm -f web/apps/*/app/lib/sdk/index.ts
          pnpm --dir web gen:api
      - name: Build frontend
        working-directory: web
        run: pnpm -F usr generate:tauri
      - name: Build bundles
        working-directory: web/apps/usr
        run: pnpm exec tauri build ${{ matrix.args }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error

  android:
    name: Android (universal APK)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 12.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: web/apps/usr/src-tauri -> target
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # The preinstalled SDK is enough; android-actions/setup-android@v3 fails on
      # current runners because it still asks sdkmanager for the removed `tools`
      # package.
      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          TOOLS=$(ls -d "$SDK"/cmdline-tools/*/bin | head -1)
          yes | "$TOOLS/sdkmanager" --install "platform-tools" "platforms;android-37.0" "build-tools;37.0.0" "ndk;27.2.12479018"
          {
            echo "ANDROID_HOME=$SDK"
            echo "ANDROID_SDK_ROOT=$SDK"
            echo "NDK_HOME=$SDK/ndk/27.2.12479018"
          } >> "$GITHUB_ENV"
      - name: Configure release signing
        env:
          ANDROID_KEY_BASE64: ${{ secrets.ANDROID_KEY_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEY_BASE64" || { echo "missing ANDROID_KEY_BASE64 secret"; exit 1; }
          echo "$ANDROID_KEY_BASE64" | base64 -d > "$RUNNER_TEMP/keystore.jks"
          cat > web/apps/usr/src-tauri/gen/android/keystore.properties <<EOF
          keyAlias=$ANDROID_KEY_ALIAS
          password=$ANDROID_KEY_PASSWORD
          storeFile=$RUNNER_TEMP/keystore.jks
          EOF
      - name: Install dependencies
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Generate API SDK
        run: |
          go install github.com/swaggo/swag/v2/cmd/swag@v2.0.0-rc5
          "$(go env GOPATH)/bin/swag" init --parseDependency --parseInternal
          rm -f web/apps/*/app/lib/sdk/index.ts
          pnpm --dir web gen:api
      - name: Build frontend
        working-directory: web
        run: pnpm -F usr generate:tauri
      - name: Build APK
        working-directory: web/apps/usr
        run: pnpm exec tauri android build --apk
      - name: Collect APK
        working-directory: web/apps/usr
        shell: bash
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk \
             "$GITHUB_WORKSPACE/artifacts/Codemgr Vault_${VERSION}_universal.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: artifacts/*.apk
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tag matches tauri.conf.json version
        run: |
          VERSION=$(node -p "require('./web/apps/usr/src-tauri/tauri.conf.json').version")
          test "v$VERSION" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$VERSION"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
